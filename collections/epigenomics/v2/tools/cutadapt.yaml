evidence_spans:
- Run [Cutadapt](https://github.com/marcelm/cutadapt/) to remove adaptor sequence from the reads
- Many tools exist for the removal of adapters such as Trimmomatic [20], cutadapt [21], Trim Galore [22], and BBDuk [14].
- Cutadapt removes adapter sequences from high-throughput sequencing reads
- Fastq files obtained by MiSeq system (Illumina) were trimmed with cutadapt software
