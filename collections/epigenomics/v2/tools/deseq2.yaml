evidence_spans:
- Actual DGE analysis is completed by both the edgeR [38] and DESeq2 [39] packages from Bioconductor
- Moderated estimation of fold change and dispersion for RNA-seq data with DESeq2
- We also performed differential expression analysis between ESCs and NPCs to map the differentially expressed (DE) genes (DEseq2, FDR < 0.05, fold change>4)
- We use DESeq2 (31) and edgeR (32) to do differential expression (DE) analysis between heart samples and brain samples
- DESeq2 (Imports)
- normalization factors for sequencing depth variation are computed using DESeq2
- scored by the (DESeq2) rlog-transformed coverage of the Nanog ChIP-nexus 5′ read ends
- Then either the DEseq2 (Love et al. 2014) or PyDESeq2 (Muzellec et al. 2022) is used to find differential genes in bulk RNA-seq data.
- edgeR and DESeq2 for differential abundance analysis [6, 7]
- The dispersion parameter φi,c is modelled dependent on the mean μi,c, using the approach of DEseq60
