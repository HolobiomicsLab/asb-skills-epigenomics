evidence_spans:
- The core of Genexpi – the algorithm for fitting model parameters – is implemented in OpenCL, with a Java wrapper.
- Watchdog is implemented in Java and thus platform-independent
- The distributed jar files are build for Java 11 and are called internally by the bash scripts.
- The distributed jar files are build for Java 11
- Install Java version >= 8 and include it in your path. Java is required to generate .hic files for visualization in Juicebox.
- Install Java version >= 8 and include it in your path.
