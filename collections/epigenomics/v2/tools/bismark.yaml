evidence_spans:
- We selected Bismark for single server aligner since Bismark has been evaluated as the best performance bisulfite aligner without losing the sensitivity
- We selected Bismark for single server aligner since Bismark has been evaluated as the best performance bisulfite aligner
- Bismark [[1](#ref1)] performs an in silico bisulfite conversion of both the reads and the reference genome
- the high-throughput sequence reads from a MethylC-seq run first must be aligned to a reference genome
- Following alignment with Bismark [[1](#ref1)], DMRfinder extracts methylation counts and clusters the CpG sites into genomic regions
- aligned with a software tool such as Bismark [6]
- A SAM alignment file produced by Bismark, whether gzip-compressed or not, can be used directly as the `<input>` file.
- After alignment of the sequence reads to a reference genome by a software package such as Bismark
- If you are using bismark, start with the .cov produced by bismark_methylation_extractor
- Trimmed reads were aligned with bismark software using human reference build hg19
- mapped to the bisulfite-converted concatenated reference genomes of each respective synthetic microbiome using bismark 0.22.2
