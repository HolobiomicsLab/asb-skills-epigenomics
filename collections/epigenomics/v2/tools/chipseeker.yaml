evidence_spans:
- ChIPseeker [13] are R packages specifically designed for ChIP-seq quality control
- There are many tools in R (e.g. *ChIPseeker*) that can be used to conduct downstream analysis and comparison of epigenomic datasets.
- These are ChromHMM (Ernst and Kellis, 2017), ChIPseeker (Yu et al., 2015), enrichment analysis (KEGG pathway and GO)
