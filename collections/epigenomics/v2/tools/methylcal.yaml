evidence_spans:
- This package allows the calibration of methylation levels using **MethylCal**, a Bayesian calibration tool based on INLA
- MethylCal as presented in Ochoa et. (2019) is implemented in the function `MethylCalCalibrationPlot`.
- The main functions for the correction of the methylation levels in case and control samples are `MoskalevCorrection` and `MethycalCorrection`.
- This package allows the calibration of methylation levels using **MethylCal**
- MethylCal performs a differential methylation test to detect hyper- and hypo-methylated samples.
