evidence_spans:
- We accept the same format as the HiCsummary file format for HOMER runHiCpca.pl.
- HOMER Differential Scores (for comparison)
- many MEA methods such as MEIRLOP and HOMER treat motif presence within a sequence under a zero-or-one-occurrence-per-sequence (ZOOPs) model
- For the motif calling part, [HOMER](http://homer.ucsd.edu/homer/motif/) is utilized.
- regulatory motifs as well, when combined with tools like Homer38 or chromVAR13
