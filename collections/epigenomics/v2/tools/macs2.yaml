evidence_spans:
- sub-sample bam files and do macs2 fragment size estimation.
- '.. _MACS2: https://github.com/taoliu/MACS'
- ChiLin uses MACS2 (https://github.com/taoliu/MACS/) as the default peak caller
- absolute path to ``macs2``
- FDR cutoff for macs2 peak calling
- This step of the analysis is optional, but recommended in order to refine the peak annotation prior to enrichment analysis. To be able to run this module, MACS2 is required25.
- For narrow binding profiles, MACS2 is used to identify candidate regions by using a dynamic Poisson distribution
- the average number of histone modification peak (MACS2 p-value < 1e-5) differences between ESC and NPC per 100 Kb
- Aligned fragments (BAM files) of both epigenomic marks were processed with the MACS2 peak caller [10] to identify regions which showed enrichment relative to a input control sample
- Aligned fragments (BAM files) of both epigenomic marks were processed with the MACS2 peak caller [10]
- We mostly used the default parameters and thresholds as recommended by the authors since these results are likely those that an end user would also obtain
- We used MACS2 on ENCODE GATA1 ChIP-seq alignment files
- Both methods are inspired by aspects of the MACS2 package that is commonly used to analyze ChIP-Seq data (Zhang et al. 2008)
